[project]
name = "comfyui-faceswap"
version = "0.0.1"
description = "ComfyUI custom node for commercial-friendly face swap (GHOST / hyperswap) — POC stage."
authors = [{ name = "Lukas Kmoch", email = "lukas.kmoch@designeo.cz" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/magiak/comfyui-faceswap"

[tool.comfy]
PublisherId = "designeo"
DisplayName = "Face Swap (Designeo)"
Icon = ""
